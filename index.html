<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="style.css" />
    <title>Valentine Letter</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Aldrich&family=Pixelify+Sans:wght@400..700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- Envelope Screen -->
    <div id="envelope-container">
      <img src="envelope.png" alt="Envelope" id="envelope" />
      <p>♡ Baby Charleneee ♡</p>
    </div>

    <!-- Letter Screen -->
    <div id="letter-container">
      <div class="letter-window">
        <h1 id="letter-title">Do you still love me, Baby?</h1>

        <img src="bunny.gif" class="cat" id="letter-cat" />

        <div class="buttons" id="letter-buttons">
          <img src="yes.png" class="btn yes-btn" alt="Yes" id="first-yes-btn" />
          <div class="no-wrapper">
            <img src="no.png" class="btn no-btn" alt="No" />
          </div>
        </div>

        <!-- Final screen elements nested cleanly INSIDE letter-window -->
        <p id="final-text" class="final-text" style="display: none;">
          <strong>Okiii click this baby:</strong>
        </p>

        <div class="buttons" id="link-button" style="display: none;">
          <a href="https://drive.google.com/file/d/1pbmPeXlZhRQ0adPR539IFHJ-SY5tlrOM/view?usp=drivesdk" target="_blank">
            <img src="click.png" class="btn click-btn" alt="Click" />
          </a>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
